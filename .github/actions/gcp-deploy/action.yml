name: gcp-deploy
description: >-
  Deploy the aion-runtime image (built and published by the aion-runtime repo)
  to Cloud Run: apply infra, run the migration job (migration-before-deploy,
  halts on failure), roll the service, then smoke-test. aion-infra does NOT build
  the runtime image — it consumes it (ADR-002). Shared by staging and production
  so the two environments deploy the SAME way (aion-infra §44).

inputs:
  environment:
    required: true
  project_id:
    required: true
  region:
    required: true
  state_bucket:
    required: true
  app_password:
    required: true
  migrator_password:
    required: true
  image:
    description: The aion-runtime image to deploy (e.g. ghcr.io/ceoloo/aion-runtime:<sha>).
    required: true

runs:
  using: composite
  steps:
    - name: Resolve names
      shell: bash
      run: |
        echo "PREFIX=aion-${{ inputs.environment }}" >> "$GITHUB_ENV"
        echo "IMAGE=${{ inputs.image }}" >> "$GITHUB_ENV"
        # Release SHA = the image tag (the aion-runtime commit baked into it).
        echo "RELEASE_SHA=${IMAGE##*:}" >> "$GITHUB_ENV"
        echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      env:
        IMAGE: ${{ inputs.image }}

    # 1) Infra is declarative and applied first (idempotent). Image changes are
    #    ignored by Terraform, so this does not fight the rollout below.
    - name: terraform apply
      shell: bash
      working-directory: providers/gcp/terraform/environments/${{ inputs.environment }}
      env:
        TF_VAR_project_id: ${{ inputs.project_id }}
        TF_VAR_region: ${{ inputs.region }}
        TF_VAR_app_password: ${{ inputs.app_password }}
        TF_VAR_migrator_password: ${{ inputs.migrator_password }}
        TF_VAR_image: ${{ inputs.image }}
        TF_VAR_git_sha: ${{ env.RELEASE_SHA }}
        TF_VAR_build_time: ${{ env.BUILD_TIME }}
      run: |
        terraform init -backend-config="bucket=${{ inputs.state_bucket }}"
        terraform apply -input=false -auto-approve

    # 2) Migration-BEFORE-deploy. Point the job at the aion-runtime image,
    #    execute, WAIT. A failed migration returns non-zero here and stops the
    #    deploy — the currently-serving revision is left intact (§46, §63).
    - name: run migrations (job)
      shell: bash
      run: |
        gcloud run jobs update "${PREFIX}-migrate" \
          --project "${{ inputs.project_id }}" --region "${{ inputs.region }}" \
          --image "${IMAGE}"
        gcloud run jobs execute "${PREFIX}-migrate" \
          --project "${{ inputs.project_id }}" --region "${{ inputs.region }}" --wait

    # 3) Roll the service to the aion-runtime image (managed TLS, probe-gated).
    - name: deploy runtime
      shell: bash
      run: |
        gcloud run services update "${PREFIX}-runtime" \
          --project "${{ inputs.project_id }}" --region "${{ inputs.region }}" \
          --image "${IMAGE}"

    # 4) Non-destructive smoke test against the deployed revision.
    - name: smoke test
      shell: bash
      run: |
        URL="$(gcloud run services describe "${PREFIX}-runtime" \
          --project '${{ inputs.project_id }}' --region '${{ inputs.region }}' \
          --format 'value(status.url)')"
        TOKEN="$(gcloud auth print-identity-token)"
        URL="${URL}" TOKEN="${TOKEN}" EXPECTED_SHA="${RELEASE_SHA}" \
          scripts/smoke-test.sh
