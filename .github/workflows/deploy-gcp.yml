name: deploy

# Controlled deployment (aion-infra §24–26). Staging deploys automatically after
# a merge to main; PRODUCTION requires a deliberate human approval via the
# GitHub Environment protection rule (the human gate — §25, §64) and only ever
# runs from main. No AI worker can independently release to production.
#
# The runtime IMAGE is built and published by the aion-runtime repo (ADR-002);
# aion-infra CONSUMES it — it does not build it. Deployments resolve and persist
# an IMMUTABLE runtime commit SHA (never a bare :latest), so rollback is
# deterministic and "which runtime is this?" has one answer.
#
# READINESS GATE: the GCP jobs only run once the WIF + CI service-account vars
# exist. Until GCP is configured they stay dormant (no noisy Google-auth
# failures); setting the vars reactivates them with no further change.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        type: choice
        options: [staging, production]
        default: staging
      runtime_image:
        description: Pin a specific aion-runtime image (blank = resolve latest main SHA)
        default: ''

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGION: us-central1
  TF_VERSION: 1.9.8

jobs:
  # Resolve the immutable image to deploy. An explicit input wins; otherwise the
  # default is the aion-runtime main HEAD commit SHA (its CI publishes
  # ghcr.io/ceoloo/aion-runtime:<sha> for every main push). Never :latest.
  resolve:
    name: resolve immutable runtime image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.pick.outputs.image }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ github.event.inputs.runtime_image }}
        run: |
          set -euo pipefail
          if [ -n "${PINNED}" ]; then
            echo "image=${PINNED}" >> "$GITHUB_OUTPUT"
          else
            SHA="$(gh api repos/ceoloo/aion-runtime/commits/main --jq .sha)"
            echo "image=ghcr.io/ceoloo/aion-runtime:${SHA}" >> "$GITHUB_OUTPUT"
          fi

  # ── Staging: automatic after merge to main — ONLY when GCP is configured ──
  staging:
    name: deploy staging
    needs: resolve
    if: >
      (github.event_name == 'push' || github.event.inputs.target == 'staging') &&
      vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' &&
      vars.GCP_CI_SERVICE_ACCOUNT_STAGING != ''
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT_STAGING }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: deploy
        uses: ./.github/actions/gcp-deploy
        with:
          environment: staging
          project_id: ${{ vars.GCP_PROJECT_STAGING }}
          region: ${{ env.REGION }}
          state_bucket: ${{ vars.GCP_TFSTATE_BUCKET_STAGING }}
          app_password: ${{ secrets.STAGING_APP_DB_PASSWORD }}
          migrator_password: ${{ secrets.STAGING_MIGRATOR_DB_PASSWORD }}
          image: ${{ needs.resolve.outputs.image }}

  # ── Production: manual, human-gated, main only — ONLY when GCP is configured ─
  production:
    name: deploy production
    needs: resolve
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.target == 'production' &&
      vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' &&
      vars.GCP_CI_SERVICE_ACCOUNT_PRODUCTION != ''
    runs-on: ubuntu-latest
    # This Environment MUST have a required-reviewers protection rule configured
    # in GitHub → the human gate. The job pauses here until a human approves.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: refuse non-main refs
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "production deploys only from main (got ${GITHUB_REF})" >&2
            exit 1
          fi
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT_PRODUCTION }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: deploy
        uses: ./.github/actions/gcp-deploy
        with:
          environment: production
          project_id: ${{ vars.GCP_PROJECT_PRODUCTION }}
          region: ${{ env.REGION }}
          state_bucket: ${{ vars.GCP_TFSTATE_BUCKET_PRODUCTION }}
          app_password: ${{ secrets.PRODUCTION_APP_DB_PASSWORD }}
          migrator_password: ${{ secrets.PRODUCTION_MIGRATOR_DB_PASSWORD }}
          image: ${{ needs.resolve.outputs.image }}
