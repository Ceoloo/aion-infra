name: deploy-vps

# VPS deployment path (aion-infra amendment §13): build the SAME immutable
# runtime image, push it to a registry, then deploy over SSH. Production
# preserves the human gate via a GitHub Environment required-reviewers rule.
# No private SSH key is exposed beyond the Environment secret it lives in.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target VPS environment
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-vps-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  build:
    name: build + push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aion-runtime:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: runtime
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: |
            AION_CORE_REF=${{ vars.AION_CORE_REF }}
            AION_DATA_REF=${{ vars.AION_DATA_REF }}

  deploy:
    name: deploy over SSH
    needs: build
    runs-on: ubuntu-latest
    # For production this Environment MUST carry a required-reviewers rule — the
    # human gate (contract §5; aion-infra §13, §25). Approval pauses the job.
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: refuse non-main for production
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "production VPS deploy only from main" >&2; exit 1
          fi
      - name: deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_IMAGE
          script: |
            set -euo pipefail
            cd /opt/aion
            # write the new image tag into .env without exposing other secrets
            sudo sed -i "s#^AION_IMAGE=.*#AION_IMAGE=${DEPLOY_IMAGE}#" .env
            sudo sed -i "s#^GIT_SHA=.*#GIT_SHA=${GITHUB_SHA}#" .env
            ./scripts/deploy.sh
        env:
          DEPLOY_IMAGE: ${{ needs.build.outputs.image }}
          GITHUB_SHA: ${{ github.sha }}
