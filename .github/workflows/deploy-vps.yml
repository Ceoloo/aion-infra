name: deploy-vps

# VPS deployment path (aion-infra amendment §13). The runtime IMAGE is built and
# published by the aion-runtime repo (ADR-002); aion-infra CONSUMES it — it does
# not build it. This workflow deploys a given aion-runtime image over SSH.
# Production preserves the human gate via a GitHub Environment required-reviewers
# rule. No private SSH key is exposed beyond the Environment secret it lives in.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target VPS environment
        type: choice
        options: [staging, production]
        default: staging
      runtime_image:
        description: aion-runtime image to deploy (default = latest published)
        default: ghcr.io/ceoloo/aion-runtime:latest

permissions:
  contents: read

concurrency:
  group: deploy-vps-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy over SSH
    runs-on: ubuntu-latest
    # For production this Environment MUST carry a required-reviewers rule — the
    # human gate (contract §5; aion-infra §13, §25). Approval pauses the job.
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: refuse non-main for production
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "production VPS deploy only from main" >&2; exit 1
          fi
      - name: deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_IMAGE
          script: |
            set -euo pipefail
            cd /opt/aion
            # Point .env at the chosen aion-runtime image + record its tag as GIT_SHA.
            sudo sed -i "s#^AION_IMAGE=.*#AION_IMAGE=${DEPLOY_IMAGE}#" .env
            sudo sed -i "s#^GIT_SHA=.*#GIT_SHA=${DEPLOY_IMAGE##*:}#" .env
            ./scripts/deploy.sh
        env:
          DEPLOY_IMAGE: ${{ github.event.inputs.runtime_image }}
