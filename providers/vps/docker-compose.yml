# ============================================================================
# AION — generic Linux VPS deployment profile (Hostinger / DO / Hetzner / EC2).
# ============================================================================
# OPS-001 production edge: Traefik (already on the VPS) terminates TLS and
# routes to the Runtime. Do NOT run Caddy alongside Traefik.
#
#   DNS → runtime.<domain>
#     → Traefik :443  (host / existing edge — external Docker network)
#     → aion-runtime :8080  (this compose; NOT published on the host)
#     → PostgreSQL (Mode A local or Mode B managed — never public)
#
# Database modes (see providers/vps/README.md):
#   Mode A (local DB):   `AION_LOCAL_DB=1 ./scripts/deploy.sh`
#   Mode B (managed DB): `./scripts/deploy.sh`
#
# Secrets: root-owned 0600 `/opt/aion/.env` (never commit). The long-running
# runtime receives an explicit env allowlist that EXCLUDES MIGRATION_DATABASE_URL.
#
# Legacy Caddy (greenfield VPS with no Traefik): compose profile `caddy` —
# see legacy/Caddyfile. Prefer Traefik when the host already has it.

name: aion

services:
  # ── The AION runtime — SAME immutable image used on AWS/GCP ───────────────
  aion-runtime:
    image: ${AION_IMAGE:?set AION_IMAGE (…/aion-runtime:<git-sha>)}
    restart: unless-stopped
    environment:
      PORT: "8080"
      AION_ENVIRONMENT: ${AION_ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_VERSION: ${SERVICE_VERSION:-unknown}
      GIT_SHA: ${GIT_SHA:-unknown}
      DATABASE_SSL: ${DATABASE_SSL:-true}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      # Comma-separated Console origins (Vercel). Empty = no CORS headers.
      AION_CORS_ORIGINS: ${AION_CORS_ORIGINS:-}
      # GHL Private Integration — required for Phase A/B live CRM plane.
      # Set in /opt/aion/.env (0600). PIT must include contacts + opportunities
      # scopes; locations-only is not enough for the acceptance gate.
      GHL_API_KEY: ${GHL_API_KEY:-}
      GHL_LOCATION_ID: ${GHL_LOCATION_ID:-}
      GHL_API_VERSION: ${GHL_API_VERSION:-2021-07-28}
    # Internal only — never publish 8080 on the host. Traefik reaches us via
    # the external edge network + Docker labels.
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    stop_grace_period: 30s
    networks:
      - internal
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${AION_TRAEFIK_NETWORK:-aion_edge}
      - traefik.http.routers.aion-runtime.rule=Host(`${AION_DOMAIN:?set AION_DOMAIN}`)
      - traefik.http.routers.aion-runtime.entrypoints=${AION_TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.aion-runtime.tls=true
      - traefik.http.routers.aion-runtime.tls.certresolver=${AION_TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.aion-runtime.loadbalancer.server.port=8080
      - traefik.http.routers.aion-runtime.service=aion-runtime
      # ── Browser CORS for the Operator Console — enforced at the EDGE ─────────
      # The Runtime image is origin-agnostic; Traefik answers preflight and adds
      # Access-Control-* for exactly the origins in AION_CORS_ORIGINS (empty ⇒ no
      # CORS headers ⇒ same-origin/edge only). No credentials (token/header auth).
      - traefik.http.middlewares.aion-cors.headers.accessControlAllowOriginList=${AION_CORS_ORIGINS:-}
      - traefik.http.middlewares.aion-cors.headers.accessControlAllowMethods=GET,POST,OPTIONS
      - traefik.http.middlewares.aion-cors.headers.accessControlAllowHeaders=content-type,authorization,x-aion-tenant-id,x-aion-operator-id
      - traefik.http.middlewares.aion-cors.headers.accessControlMaxAge=86400
      - traefik.http.middlewares.aion-cors.headers.addVaryHeader=true
      - traefik.http.routers.aion-runtime.middlewares=aion-cors@docker

  # ── Revenue Copilot HTTP service (MISSION-001 entrypoint shape #2) ─────────
  # Enable with: docker compose --profile revenue-copilot up -d
  # Consumes OpenRouter from /opt/aion/.env; does NOT inject keys into runtime.
  # Must point at Execution Gateway Runtime for durable /v1 commands.
  revenue-copilot:
    profiles: ["revenue-copilot"]
    image: ${COPILOT_IMAGE:?set COPILOT_IMAGE for revenue-copilot profile}
    restart: unless-stopped
    environment:
      PORT: "8080"
      AION_ENVIRONMENT: ${AION_ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0}
      GIT_SHA: ${GIT_SHA:-unknown}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-3.5-sonnet}
      # Durable Runtime — required for production /api → /v1/commands path.
      # Prefer live Hostinger FQDN until runtime.aionsystems.ai DNS resolves.
      AION_RUNTIME_URL: ${AION_RUNTIME_URL:-https://runtime.srv1655818.hstgr.cloud}
      AION_TENANT_ID: ${AION_TENANT_ID:-aion-systems}
      # GHL_* reserved — read-only wiring later; writes blocked until gateway:
      # GHL_API_KEY: ${GHL_API_KEY}
      # GHL_LOCATION_ID: ${GHL_LOCATION_ID}
      # GHL_API_VERSION: ${GHL_API_VERSION:-2021-07-28}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    stop_grace_period: 30s
    networks:
      - internal
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${AION_TRAEFIK_NETWORK:-aion_edge}
      - traefik.http.routers.aion-copilot.rule=Host(`${COPILOT_DOMAIN:-copilot.${AION_DOMAIN}}`)
      - traefik.http.routers.aion-copilot.entrypoints=${AION_TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.aion-copilot.tls=true
      - traefik.http.routers.aion-copilot.tls.certresolver=${AION_TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.aion-copilot.loadbalancer.server.port=8080
      - traefik.http.routers.aion-copilot.service=aion-copilot

  # ── OPTIONAL local PostgreSQL (Mode A). Enable with --profile local-db ────
  postgres:
    image: postgres:16-alpine
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env for local-db}
      POSTGRES_DB: ${POSTGRES_DB:-aion_data}
      AION_APP_PASSWORD: ${AION_APP_PASSWORD:?set in .env for local-db}
      AION_MIGRATOR_PASSWORD: ${AION_MIGRATOR_PASSWORD:?set in .env for local-db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./system/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  # ── Legacy Caddy (only when the host has NO Traefik). Profile: caddy ──────
  # Do not enable this profile next to an existing Traefik on :80/:443.
  caddy:
    profiles: ["caddy"]
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      aion-runtime:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./legacy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      AION_DOMAIN: ${AION_DOMAIN:?set AION_DOMAIN in .env}
    networks: [edge, internal]

networks:
  # The network Traefik uses to reach the Runtime. Always `external` here — it is
  # provisioned OUTSIDE this compose file:
  #   * host Traefik on its own network  → that pre-existing network
  #   * host Traefik in network_mode:host → an AION-owned bridge that
  #     scripts/deploy.sh creates when AION_TRAEFIK_NETWORK_EXTERNAL=false
  # Either way, set AION_TRAEFIK_NETWORK to its name.
  traefik:
    external: true
    name: ${AION_TRAEFIK_NETWORK:-aion_edge}
  edge:
    # Used only by the optional Caddy profile.
  internal:
    name: aion_internal

volumes:
  caddy_data:
  caddy_config:
  pgdata:
